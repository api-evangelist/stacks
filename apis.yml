name: Stacks
description: >-
  Stacks is an AI-native financial close and accounting platform for controllers,
  CFOs, and accounting teams. It automates the monthly close across existing ERPs
  with agentic tooling for account reconciliations and transaction matching,
  journal-entry posting and review, close-management checklists and approvals, and
  AI-powered analysis, variance explanation, and reporting. Stacks connects directly
  to ERP systems (Microsoft Dynamics 365, NetSuite, SAP S/4HANA, Workday), data
  warehouses (Snowflake, Databricks, BigQuery, Redshift), file storage, and
  spreadsheets, and offers an Excel add-in for manual journals. A developer API for
  custom reconciliation logic is announced as "coming soon." Stacks is a fintech
  company backed by EQT Ventures, General Catalyst, Lux Capital, Union Square
  Ventures, and Version One Ventures. Profile enriched by the API Evangelist
  pipeline from public web surfaces (no public API specification is yet available).
